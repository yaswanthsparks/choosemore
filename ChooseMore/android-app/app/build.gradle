plugins {
    id "com.android.application"
}

def localServerUrl = providers.gradleProperty("apiBaseUrl")
    .getOrElse("http://10.0.2.2:8989/")

android {
    namespace "com.purchasemore.demo"
    compileSdk 37

    defaultConfig {
        applicationId "com.purchasemore.demo"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0-demo"
        buildConfigField "String", "LOCAL_SERVER_URL", "\"${localServerUrl}\""
    }

    buildFeatures {
        buildConfig true
    }
}
